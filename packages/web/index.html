<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product OS</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Product OS" />
    <meta name="description" content="AI-powered product management workflow that turns ideas into specs, strategies, and launch materials using specialized agents" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://product-os.ai/" />
    <meta property="og:title" content="Product OS" />
    <meta property="og:description" content="AI-powered product management workflow that turns ideas into specs, strategies, and launch materials using specialized agents" />
    <meta property="og:image" content="https://product-os.ai/social.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://product-os.ai/" />
    <meta property="twitter:title" content="Product OS" />
    <meta property="twitter:description" content="AI-powered product management workflow that turns ideas into specs, strategies, and launch materials using specialized agents" />
    <meta property="twitter:image" content="https://product-os.ai/social.png" />
    <!-- Sync dark mode with system preference before first paint to avoid flash -->
    <script>
      (function() {
        function apply() {
          document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
        }
        apply();
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
