services:
  postgres:
    image: postgres:16-alpine
    container_name: product_os_db
    environment:
      POSTGRES_USER: product_os
      POSTGRES_PASSWORD: product_os
      POSTGRES_DB: product_os
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_os -d product_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
